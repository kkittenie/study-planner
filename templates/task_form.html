{% extends "base.html" %}

{% block title %}{% if is_edit %}Edit Tugas{% else %}Tambah Tugas Baru{% endif %} | Study Planner{% endblock %}

{% block content %}
<div class="card-editorial cream-bg" style="max-width: 660px; margin: 0 auto;">
  <div class="card-title-editorial">
    <span>{% if is_edit %}Edit Tugas{% else %}Tambah Tugas Baru{% endif %}</span>
    <a href="{{ url_for('tasks') }}" class="btn-editorial btn-editorial-teal btn-editorial-sm">Kembali</a>
  </div>

  <form method="POST">
    <div class="form-group">
      <label class="form-label" for="title">Judul Tugas *</label>
      <input type="text" id="title" name="title" class="form-control" value="{{ task.title if task else '' }}" required placeholder="contoh: Soal Latihan Kalkulus Bab 4">
    </div>

    <div class="form-group">
      <label class="form-label" for="subject_id">Mata Pelajaran</label>
      <select id="subject_id" name="subject_id" class="form-control">
        <option value="">Pilih Mata Pelajaran</option>
        {% for sub in subjects %}
          <option value="{{ sub.id }}" {% if task and task.subject_id == sub.id %}selected{% endif %}>
            {{ sub.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="deadline">Tanggal Tenggat *</label>
      <input type="date" id="deadline" name="deadline" class="form-control" value="{{ task.deadline if task else default_date }}" required>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
      <div class="form-group">
        <label class="form-label" for="priority">Prioritas</label>
        <select id="priority" name="priority" class="form-control">
          <option value="Low" {% if task and task.priority == 'Low' %}selected{% endif %}>Rendah (Low)</option>
          <option value="Medium" {% if not task or task.priority == 'Medium' %}selected{% endif %}>Sedang (Medium)</option>
          <option value="High" {% if task and task.priority == 'High' %}selected{% endif %}>Tinggi (High)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="status">Status</label>
        <select id="status" name="status" class="form-control">
          <option value="To Do" {% if not task or task.status == 'To Do' %}selected{% endif %}>Belum Dimulai (To Do)</option>
          <option value="In Progress" {% if task and task.status == 'In Progress' %}selected{% endif %}>Sedang Dikerjakan</option>
          <option value="Completed" {% if task and task.status == 'Completed' %}selected{% endif %}>Selesai (Completed)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="description">Deskripsi / Catatan</label>
      <textarea id="description" name="description" class="form-control" rows="4" placeholder="Tambahkan instruksi tugas atau langkah-langkah pengerjaan...">{{ task.description if task else '' }}</textarea>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 1.75rem;">
      <button type="submit" class="btn-editorial btn-editorial-coral" style="flex: 1; padding: 0.85rem;">
        {% if is_edit %}Simpan Perubahan{% else %}Simpan Tugas Baru{% endif %}
      </button>
      <a href="{{ url_for('tasks') }}" class="btn-editorial btn-editorial-teal" style="padding: 0.85rem;">Batal</a>
    </div>
  </form>
</div>
{% endblock %}
