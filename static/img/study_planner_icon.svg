<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5714F"/>
      <stop offset="100%" stop-color="#EA5A3D"/>
    </linearGradient>
  </defs>

  <!-- Background badge -->
  <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#bgGrad)"/>

  <!-- soft inner highlight circle (decorative, like dashboard blobs) -->
  <circle cx="400" cy="120" r="70" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="130" cy="410" r="90" fill="#163C39" opacity="0.06"/>

  <!-- Open book -->
  <g>
    <!-- left page -->
    <path d="M256,206
             C 214,172 148,160 100,168
             L 100,330
             C 148,322 214,334 256,368
             Z"
          fill="#FCF6EA" stroke="#163C39" stroke-width="6" stroke-linejoin="round"/>
    <!-- right page -->
    <path d="M256,206
             C 298,172 364,160 412,168
             L 412,330
             C 364,322 298,334 256,368
             Z"
          fill="#FCF6EA" stroke="#163C39" stroke-width="6" stroke-linejoin="round"/>
    <!-- spine -->
    <path d="M256,206 L256,368" stroke="#163C39" stroke-width="6" stroke-linecap="round"/>

    <!-- text lines left page -->
    <line x1="128" y1="212" x2="222" y2="234" stroke="#163C39" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <line x1="128" y1="246" x2="222" y2="264" stroke="#163C39" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="128" y1="280" x2="222" y2="294" stroke="#163C39" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- text lines right page -->
    <line x1="290" y1="234" x2="384" y2="212" stroke="#163C39" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <line x1="290" y1="264" x2="384" y2="246" stroke="#163C39" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="290" y1="294" x2="384" y2="280" stroke="#163C39" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- checklist badge (progress / done) -->
  <circle cx="382" cy="366" r="62" fill="#F0C33E" stroke="#F5714F" stroke-width="10"/>
  <path d="M356,366 L376,386 L412,344" fill="none" stroke="#163C39" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
